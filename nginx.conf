server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Security headers (supplement app-level headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # NOTE: No /api/ proxy here on Azure. Azure Front Door routes /api/*, /uploads/*,
    # /outputs/*, and /static/* directly to the backend Container App, so API traffic
    # never reaches this nginx. (The prior AWS deployment proxied /api/ to the ALB here
    # because CloudFront forwarded everything to the frontend origin; Front Door splits
    # the routes at the edge instead.)

    # Serve static assets with long cache (Vite uses content hashing so safe to cache forever)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
